# split panes using | and -
bind t split-window -h
bind b split-window -v
unbind '"'
unbind %

# emacs support:
# in sync with /home/julien/projects/config/emacs.d/lisp/jbo-keys.el
# C-PageUp/Down.
# 
# Details:
# - if-shell "$is_emacs" ... runs the same pane-command check.
# * If Emacs is running in the pane
# => send C-PPPage forwards the exact chord into the pane, letting emacs binding fire.
# * Otherwise =
# => select-pane -t :.- does tmux's own "previous pane" 
is_emacs='echo "#{pane_current_command}" | grep -iqE "emacs"'
bind -Troot C-PPage if-shell "$is_emacs" "send C-PPage" "select-pane -t :.-"
bind -Troot C-NPage if-shell "$is_emacs" "send C-NPage" "select-pane -t :.+"

# simple version without emacs support
#bind-key -n C-PageUp select-pane -t :.-
#bind-key -n C-PageDown select-pane -t :.+

bind-key m choose-window -F "#{window_index}: #{window_name}" "join-pane -v -t %%"

# Use 256 colors / tmux terminfo
set -g default-terminal "tmux-256color"

# Ensure xterm keys like Home/End are passed properly
set -g xterm-keys on


# reload config with C-b r
bind r source-file ~/.tmux.conf

# confiture copy mode with C-b c
bind-key c copy-mode
# s: start selection  
bind-key -T copy-mode s send-keys -X begin-selection
# enter: copy and leave
bind-key -T copy-mode Enter send-keys -X pipe-and-cancel "xclip -selection c -i"

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=white'

# panes
set -g pane-border-style 'fg=gray bg=gray'
set -g pane-active-border-style 'bg=blue'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=white bold bg=blue'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=white bg=gray'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

# workaround for ESC to work in opencode 
set -g escape-time 10

